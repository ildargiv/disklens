name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, suffix: windows-amd64, exe: ".exe" }
          - { goos: windows, goarch: arm64, suffix: windows-arm64, exe: ".exe" }
          - { goos: linux, goarch: amd64, suffix: linux-amd64, exe: "" }
          - { goos: linux, goarch: arm64, suffix: linux-arm64, exe: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >
          go build -trimpath
          -ldflags "-s -w -X disklens/internal/buildinfo.Version=${GITHUB_REF_NAME}"
          -o dist/disklens-${{ matrix.suffix }}${{ matrix.exe }}
          ./cmd/disklens
      - uses: actions/upload-artifact@v4
        with:
          name: disklens-${{ matrix.suffix }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*
          generate_release_notes: true
